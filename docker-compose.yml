version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cadastro-pessoas-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: cadastro_pessoas
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - cadastro-pessoas-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Application service (uncomment when ready)
  # app:
  #   build: .
  #   container_name: cadastro-pessoas-api
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - APP_ENV=local
  #     - MONGODB_URI=mongodb://admin:admin123@mongodb:27017
  #     - MONGODB_DATABASE=cadastro_pessoas
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #   networks:
  #     - cadastro-pessoas-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  cadastro-pessoas-network:
    driver: bridge

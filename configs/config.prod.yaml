server:
  port: 8080
  mode: release
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 120s

mongodb:
  uri: mongodb://admin:CHANGE_ME@mongodb-prod:27017/?tls=true
  database: cadastro_pessoas
  timeout: 10s
  min_pool_size: 20
  max_pool_size: 200
  max_conn_idle_time: 1h

logging:
  level: info
  format: json

app:
  name: cadastro-pessoas
  version: 1.0.0
  environment: prod

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - typecheck
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - misspell
    - gocritic
    - revive
    - gosec
    - unconvert

linters-settings:
  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/BrunnoQ/cadastro-pessoas

  gocritic:
    enabled-checks:
      - appendAssign
      - assignOp
      - boolExprSimplify
      - captLocal
      - commentFormatting
      - dupImport
      - emptyStringTest
      - hexLiteral
      - ifElseChain
      - methodExprCall
      - rangeValCopy
      - singleCaseSwitch
      - typeAssertChain
      - unlambda
      - yodaStyleExpr

  revive:
    rules:
      - name: exported
        severity: warning
      - name: package-comments
        severity: warning
      - name: error-return
        severity: warning
      - name: error-naming
        severity: warning
      - name: if-return
        severity: warning
      - name: var-naming
        severity: warning
      - name: range
        severity: warning
      - name: receiver-naming
        severity: warning
      - name: indent-error-flow
        severity: warning

  gosec:
    excludes:
      - G104 # Audit errors not checked (handled by errcheck)

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - errcheck

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - bin

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

severity:
  default-severity: error
